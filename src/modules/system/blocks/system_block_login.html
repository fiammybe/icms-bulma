<div id="block_login_form" role="region" aria-label="Login">
    <form action="<{$xoops_url}>/user.php" method="post" aria-label="Login form">
        <div class="field">
            <label class="label" for="login-uname"><{$block.lang_username}></label>
            <div class="control">
                <input id="login-uname" class="input uname" name="uname" size="12" value="<{$block.unamevalue}>" maxlength="25" type="text" placeholder="<{$block.lang_username}>">
            </div>
        </div>
        <div class="field">
            <label class="label" for="login-pass"><{$block.lang_password}></label>
            <div class="control">
                <input id="login-pass" class="input" type="password" name="pass" size="12" maxlength="32">
            </div>
        </div>
        <{if $block.rememberme }>
        <div class="field">
            <div class="control">
                <label class="checkbox">
                    <input type="checkbox" name="rememberme" id="login-remember">
                    <span><{$block.lang_rememberme}></span>
                </label>
            </div>
        </div>
        <{/if}>
        <input type="hidden" name="xoops_redirect" value="<{$xoops_requesturi}>" />
        <input type="hidden" name="op" value="login" />
        <div class="field">
            <div class="control">
                <button class="button is-link" type="submit"><{$block.lang_login}></button>
            </div>
        </div>
        <div class="mt-2"> <{$block.sslloginlink}></div>
    </form>
</div>
<p class="mt-2"><a href="<{$xoops_url}>/user.php#lost" title="<{$block.lang_lostpass}>"><{$block.lang_lostpass}></a></p>
<{if $block.registration }>
    <p class="mt-2"><a href="<{$xoops_url}>/register.php" title="<{$block.lang_registernow}>"><{$block.lang_registernow}></a></p>
<{/if}>
